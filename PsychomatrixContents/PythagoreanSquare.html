<!DOCTYPE html>
<html>
<head>
    <title>Pythagorean Square</title>
    <link rel="stylesheet" href="../css/PsychomatrixStyle.css">
    <style>
        .pythagorean-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 300px;
            margin: 20px auto;
        }
        .grid-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #333;
            border-radius: 8px;
        }
        .number-1 { background-color: rgba(255, 224, 224, 0.7); }
        .number-2 { background-color: rgba(249, 234, 230, 0.7); }
        /* ... สีอื่นๆ ... */
    </style>
</head>
<body>
    <div class="pythagorean-container">
        <h1><i class="fas fa-square-root-alt"></i> Pythagorean Square</h1>
        
        <!-- กริด Pythagorean -->
        <div class="pythagorean-grid" id="pythagoreanGrid">
            <!-- จะถูกเติมโดย JavaScript -->
        </div>
        
        <!-- การวิเคราะห์แต่ละเซลล์ -->
        <div class="analysis-sections" id="analysisSections"></div>
    </div>
    
    <script>
        // อ่านข้อมูลจาก sessionStorage
        const results = JSON.parse(sessionStorage.getItem('psychomatrixFullResults'));
        
        if (results && results[0] && results[0].data.pythagorean) {
            const pythagorean = results[0].data.pythagorean;
            
            // สร้างกริด
            const grid = document.getElementById('pythagoreanGrid');
            for (let i = 1; i <= 9; i++) {
                const cell = document.createElement('div');
                cell.className = `grid-cell number-${i}`;
                cell.textContent = `${i} (${pythagorean.counts[i]})`;
                cell.title = `เซลล์ ${i}: ${pythagorean.counts[i]} ตัว`;
                grid.appendChild(cell);
            }
            
            // แสดงการวิเคราะห์
            const analysisDiv = document.getElementById('analysisSections');
            pythagorean.analysis.forEach(item => {
                const section = document.createElement('div');
                section.className = 'analysis-item';
                section.innerHTML = `
                    <h3>เซลล์ ${item.cell}</h3>
                    <p>จำนวน: ${item.count} ตัว</p>
                    <p>ระดับพลังงาน: ${getEnergyText(item.energyLevel)}</p>
                    <p>${item.description}</p>
                `;
                analysisDiv.appendChild(section);
            });
        }
        
        function getEnergyText(level) {
            const map = {
                'LackOfEnergy': 'พลังน้อยหรือขาดหาย',
                'BalancedEnergy': 'พลังสมดุล',
                'OverEnergy': 'พลังมากเกินไป'
            };
            return map[level] || level;
        }
    </script>
</body>
</html>
