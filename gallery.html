    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- โหลดไฟล์ JS ตามลำดับที่ถูกต้อง -->
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth_status_manager.js"></script>
    
    <script>
        // Gallery JavaScript
        let supabase = null;
        let currentUser = null;
        let currentSubmissionId = null;
        let allMissions = [];
        
        // ฟังก์ชันรอให้ nav.js โหลดเสร็จ
        function waitForNav() {
            return new Promise((resolve) => {
                let attempts = 0;
                const maxAttempts = 30;
                
                const checkNav = setInterval(() => {
                    attempts++;
                    
                    // ตรวจสอบว่า navigation bar ถูกสร้างแล้วหรือยัง
                    const navExists = document.querySelector('nav');
                    
                    if (navExists) {
                        clearInterval(checkNav);
                        console.log("✅ Navigation bar loaded");
                        resolve();
                    } else if (attempts >= maxAttempts) {
                        clearInterval(checkNav);
                        console.warn("❌ Navigation bar not loaded, continuing anyway");
                        resolve();
                    }
                }, 100);
            });
        }
        
        // ฟังก์ชันเริ่มต้นแกลเลอรี่
        async function initGallery() {
            try {
                console.log("🔄 Initializing gallery...");
                
                // ตรวจสอบว่ามี SupabaseConfig หรือไม่
                if (window.SupabaseConfig && window.SupabaseConfig.client) {
                    supabase = window.SupabaseConfig.client();
                    console.log("✅ Using SupabaseConfig client");
                } else if (window.supabaseClient) {
                    supabase = window.supabaseClient;
                    console.log("✅ Using window.supabaseClient");
                } else if (window.initializeSupabaseClient) {
                    supabase = window.initializeSupabaseClient();
                    console.log("✅ Using initializeSupabaseClient");
                } else {
                    throw new Error("Supabase client not available");
                }
                
                if (!supabase) {
                    throw new Error("Failed to initialize Supabase client");
                }
                
                // ตรวจสอบการล็อกอิน
                const { data: { session } } = await supabase.auth.getSession();
                
                if (!session) {
                    // ถ้าไม่ได้ล็อกอิน ให้แสดงข้อความ
                    showNotLoggedInMessage();
                    return;
                }
                
                currentUser = session.user;
                console.log("✅ User authenticated:", currentUser.email);
                
                // ตั้งค่า event listeners
                setupEventListeners();
                
                // โหลดข้อมูลภารกิจ
                await loadMissions();
                
                // โหลดผลงาน
                await loadSubmissions();
                
                // อัปเดตสถิติ
                await updateStats();
                
            } catch (error) {
                console.error("❌ Error initializing gallery:", error);
                showError('ไม่สามารถโหลดแกลเลอรี่ได้: ' + error.message);
            }
        }
        
        // ฟังก์ชันแสดงข้อความกรณียังไม่ได้ล็อกอิน
        function showNotLoggedInMessage() {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-8 max-w-md mx-auto">
                        <i class="fas fa-exclamation-triangle text-yellow-500 text-4xl mb-4"></i>
                        <h3 class="text-xl font-bold text-yellow-700 mb-2">กรุณาล็อกอิน</h3>
                        <p class="text-gray-600 mb-4">คุณต้องล็อกอินเพื่อเข้าชมแกลเลอรี่ผลงาน</p>
                        <a href="login_supabase.html" class="inline-block bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg font-semibold">
                            <i class="fas fa-sign-in-alt mr-2"></i>ไปหน้าล็อกอิน
                        </a>
                    </div>
                </div>
            `;
            
            // ซ่อน filter section
            document.querySelector('.bg-white.rounded-xl').style.display = 'none';
        }
        
        // ฟังก์ชันโหลดภารกิจสำหรับ filter
        async function loadMissions() {
            try {
                const { data: missions, error } = await supabase
                    .from('missions')
                    .select('mission_id, mission_title')
                    .order('mission_title');
                
                if (error) throw error;
                
                allMissions = missions || [];
                const missionFilter = document.getElementById('missionFilter');
                
                // เพิ่ม options
                missions.forEach(mission => {
                    const option = document.createElement('option');
                    option.value = mission.mission_id;
                    option.textContent = mission.mission_title;
                    missionFilter.appendChild(option);
                });
                
            } catch (error) {
                console.error('Error loading missions:', error);
            }
        }
        
        // ฟังก์ชันโหลดผลงาน
        async function loadSubmissions() {
            const galleryGrid = document.getElementById('galleryGrid');
            
            try {
                // แสดง loading
                galleryGrid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto mb-4"></div>
                        <p class="text-gray-600">กำลังโหลดผลงาน...</p>
                    </div>
                `;
                
                // ดึง filter values
                const sortBy = document.getElementById('sortBy').value;
                const missionId = document.getElementById('missionFilter').value;
                const grade = document.getElementById('gradeFilter').value;
                
                // สร้าง query
                let query = supabase
                    .from('submissions')
                    .select(`
                        *,
                        missions (mission_title),
                        users (display_name, avatar_url)
                    `)
                    .eq('status', 'approved'); // เฉพาะผลงานที่ได้รับการอนุมัติ
                
                // ใช้ filter ภารกิจ
                if (missionId && missionId !== 'all') {
                    query = query.eq('mission_id', missionId);
                }
                
                // เรียงลำดับ
                if (sortBy === 'newest') {
                    query = query.order('created_at', { ascending: false });
                } else if (sortBy === 'popular') {
                    query = query.order('views', { ascending: false });
                } else if (sortBy === 'rating') {
                    query = query.order('average_rating', { ascending: false });
                }
                
                const { data: submissions, error } = await query;
                
                if (error) throw error;
                
                if (!submissions || submissions.length === 0) {
                    galleryGrid.innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <i class="fas fa-photo-video text-4xl text-gray-300 mb-4"></i>
                            <p class="text-gray-500">ยังไม่มีผลงานในแกลเลอรี่</p>
                            <p class="text-gray-400 text-sm mt-2">เป็นคนแรกที่ส่งผลงานเลย!</p>
                            <a href="missions.html" class="inline-block mt-4 bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg font-semibold">
                                <i class="fas fa-rocket mr-2"></i>ดูภารกิจทั้งหมด
                            </a>
                        </div>
                    `;
                    return;
                }
                
                // เรนเดอร์ผลงาน
                renderSubmissions(submissions);
                
            } catch (error) {
                console.error('Error loading submissions:', error);
                galleryGrid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <i class="fas fa-exclamation-triangle text-4xl text-red-300 mb-4"></i>
                        <p class="text-red-500">เกิดข้อผิดพลาดในการโหลดผลงาน</p>
                        <button onclick="loadSubmissions()" class="mt-4 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                            ลองอีกครั้ง
                        </button>
                    </div>
                `;
            }
        }
        
        // ฟังก์ชันเรนเดอร์ผลงาน
        function renderSubmissions(submissions) {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '';
            
            submissions.forEach(submission => {
                const card = createSubmissionCard(submission);
                galleryGrid.appendChild(card);
            });
        }
        
        // ฟังก์ชันสร้างการ์ดผลงาน
        function createSubmissionCard(submission) {
            const card = document.createElement('div');
            card.className = 'video-card bg-white rounded-xl shadow-md overflow-hidden';
            
            // กำหนดวันที่
            const submittedDate = new Date(submission.created_at);
            const timeAgo = getTimeAgo(submittedDate);
            
            card.innerHTML = `
                <div class="relative">
                    <!-- Video Thumbnail -->
                    <div class="aspect-video bg-gray-800 relative overflow-hidden">
                        <img src="https://img.youtube.com/vi/${getYouTubeId(submission.video_url)}/hqdefault.jpg" 
                             alt="Video thumbnail" 
                             class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black bg-opacity-30 flex items-center justify-center">
                            <div class="w-16 h-16 bg-white bg-opacity-80 rounded-full flex items-center justify-center">
                                <i class="fas fa-play text-purple-600 text-2xl"></i>
                            </div>
                        </div>
                        <div class="absolute top-3 right-3 bg-black bg-opacity-60 text-white text-xs px-2 py-1 rounded">
                            <i class="fas fa-clock mr-1"></i>${submission.duration || '3:45'}
                        </div>
                    </div>
                    
                    <!-- Content -->
                    <div class="p-4">
                        <h3 class="font-bold text-gray-800 mb-2 line-clamp-2" title="${submission.title || 'ผลงานวิดีโอ'}">
                            ${submission.title || 'ผลงานวิดีโอ'}
                        </h3>
                        
                        <!-- User Info -->
                        <div class="flex items-center mb-3">
                            <div class="w-8 h-8 bg-purple-500 rounded-full flex items-center justify-center text-white text-sm font-bold mr-2 overflow-hidden">
                                ${submission.users?.avatar_url ? 
                                    `<img src="${submission.users.avatar_url}" alt="" class="w-full h-full object-cover">` :
                                    `<span>${(submission.users?.display_name || 'ผู้ใช้').charAt(0)}</span>`
                                }
                            </div>
                            <div class="flex-1">
                                <div class="text-sm font-medium text-gray-700">${submission.users?.display_name || 'ผู้ใช้'}</div>
                                <div class="text-xs text-gray-500">${timeAgo}</div>
                            </div>
                        </div>
                        
                        <!-- Mission Info -->
                        <div class="mb-3">
                            <span class="inline-block bg-purple-100 text-purple-700 text-xs font-medium px-2 py-1 rounded">
                                ${submission.missions?.mission_title || 'ภารกิจ'}
                            </span>
                        </div>
                        
                        <!-- Stats -->
                        <div class="flex justify-between text-sm text-gray-600">
                            <div class="flex items-center">
                                <i class="fas fa-eye mr-1"></i>
                                <span>${submission.views || 0}</span>
                            </div>
                            <div class="flex items-center">
                                <i class="fas fa-thumbs-up mr-1"></i>
                                <span>${submission.likes || 0}</span>
                            </div>
                            <div class="flex items-center">
                                <i class="fas fa-star mr-1 text-yellow-500"></i>
                                <span>${submission.average_rating?.toFixed(1) || '0.0'}</span>
                            </div>
                            <div class="flex items-center">
                                <i class="fas fa-comment mr-1"></i>
                                <span>${submission.comment_count || 0}</span>
                            </div>
                        </div>
                        
                        <!-- Actions -->
                        <div class="mt-4 flex space-x-2">
                            <button onclick="handleVote('${submission.id}', 'like')" 
                                    class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-center">
                                <i class="fas fa-thumbs-up mr-1"></i> ชอบ
                            </button>
                            <button onclick="openRatingModal('${submission.id}')" 
                                    class="flex-1 bg-yellow-100 hover:bg-yellow-200 text-yellow-700 px-3 py-2 rounded-lg text-sm font-medium flex items-center justify-center">
                                <i class="fas fa-star mr-1"></i> ให้คะแนน
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            // เพิ่ม event listener สำหรับคลิกที่การ์ดเพื่อเปิดวิดีโอ
            card.querySelector('.aspect-video').addEventListener('click', () => {
                openVideoModal(submission);
            });
            
            return card;
        }
        
        // ฟังก์ชันคำนวณเวลาที่ผ่านมา
        function getTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);
            
            if (diffDay > 0) return `${diffDay} วันที่แล้ว`;
            if (diffHour > 0) return `${diffHour} ชั่วโมงที่แล้ว`;
            if (diffMin > 0) return `${diffMin} นาทีที่แล้ว`;
            return 'ไม่กี่วินาทีที่แล้ว';
        }
        
        // ฟังก์ชันดึง YouTube ID จาก URL
        function getYouTubeId(url) {
            if (!url) return 'dQw4w9WgXcQ'; // Default video ID
            
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            
            return (match && match[2].length === 11) ? match[2] : 'dQw4w9WgXcQ';
        }
        
        // ฟังก์ชันเปิด modal วิดีโอ
        function openVideoModal(submission) {

        // ฟังก์ชันเพิ่มจำนวน view
        async function incrementViewCount(submissionId) {
            try {
                // ดึงจำนวน view ปัจจุบัน
                const { data: submission, error: fetchError } = await supabase
                    .from('submissions')
                    .select('views')
                    .eq('id', submissionId)
                    .single();
                
                if (fetchError) throw fetchError;
                
                // อัปเดตจำนวน view
                const newViews = (submission.views || 0) + 1;
                const { error: updateError } = await supabase
                    .from('submissions')
                    .update({ views: newViews })
                    .eq('id', submissionId);
                
                if (updateError) throw updateError;
                
            } catch (error) {
                console.error('Error incrementing view count:', error);
            }
        }
        
        // ฟังก์ชันจัดการการโหวต
        async function handleVote(submissionId, type) {
            if (!currentUser) {
                alert('กรุณาล็อกอินเพื่อใช้งานฟังก์ชันนี้');
                return;
            }
            
            try {
                // ตรวจสอบว่าเคยโหวตแล้วหรือไม่
                const { data: existingVote, error: checkError } = await supabase
                    .from('votes')
                    .select('*')
                    .eq('submission_id', submissionId)
                    .eq('user_id', currentUser.id)
                    .eq('type', type)
                    .single();
                
                if (checkError && checkError.code !== 'PGRST116') throw checkError;
                
                if (existingVote) {
                    // ถ้าโหวตแล้ว ให้ยกเลิก
                    const { error: deleteError } = await supabase
                        .from('votes')
                        .delete()
                        .eq('id', existingVote.id);
                    
                    if (deleteError) throw deleteError;
                    
                    // อัปเดตจำนวน likes
                    await updateLikeCount(submissionId, -1);
                    
                    showToast('ยกเลิกการโหวตแล้ว', 'info');
                } else {
                    // ถ้ายังไม่โหวต ให้เพิ่มโหวต
                    const { error: insertError } = await supabase
                        .from('votes')
                        .insert({
                            submission_id: submissionId,
                            user_id: currentUser.id,
                            type: type
                        });
                    
                    if (insertError) throw insertError;
                    
                    // อัปเดตจำนวน likes
                    await updateLikeCount(submissionId, 1);
                    
                    showToast('โหวตสำเร็จ!', 'success');
                }
                
                // โหลดผลงานใหม่
                await loadSubmissions();
                
            } catch (error) {
                console.error('Error handling vote:', error);
                showToast('เกิดข้อผิดพลาดในการโหวต: ' + error.message, 'error');
            }
        }
        
        // ฟังก์ชันอัปเดตจำนวน likes
        async function updateLikeCount(submissionId, change) {
            try {
                // ดึงจำนวน likes ปัจจุบัน
                const { data: submission, error: fetchError } = await supabase
                    .from('submissions')
                    .select('likes')
                    .eq('id', submissionId)
                    .single();
                
                if (fetchError) throw fetchError;
                
                // คำนวณจำนวน likes ใหม่
                const newLikes = Math.max(0, (submission.likes || 0) + change);
                
                // อัปเดต
                const { error: updateError } = await supabase
                    .from('submissions')
                    .update({ likes: newLikes })
                    .eq('id', submissionId);
                
                if (updateError) throw updateError;
                
            } catch (error) {
                console.error('Error updating like count:', error);
                throw error;
            }
        }

        // ฟังก์ชันส่งคะแนน
        async function submitRating() {
            try {
                // ดึง rating จาก stars ที่เลือก
                const selectedStars = document.querySelectorAll('.star.fas');
                const rating = selectedStars.length;
                
                if (rating === 0) {
                    alert('กรุณาเลือกจำนวนดาว');
                    return;
                }
                
                const comment = document.getElementById('ratingComment').value;
                
                // บันทึก rating ลงฐานข้อมูล
                const { error } = await supabase
                    .from('ratings')
                    .insert({
                        submission_id: currentSubmissionId,
                        user_id: currentUser.id,
                        rating: rating,
                        comment: comment || null
                    });
                
                if (error) throw error;
                
                // คำนวณ average rating ใหม่
                await updateAverageRating(currentSubmissionId);
                
                showToast('ให้คะแนนสำเร็จ!', 'success');
                closeRatingModal();
                
                // โหลดผลงานใหม่
                await loadSubmissions();
                
            } catch (error) {
                console.error('Error submitting rating:', error);
                showToast('เกิดข้อผิดพลาดในการให้คะแนน: ' + error.message, 'error');
            }
        }
        
        // ฟังก์ชันอัปเดตคะแนนเฉลี่ย
        async function updateAverageRating(submissionId) {
            try {
                // ดึง ratings ทั้งหมดของ submission นี้
                const { data: ratings, error } = await supabase
                    .from('ratings')
                    .select('rating')
                    .eq('submission_id', submissionId);
                
                if (error) throw error;
                
                // คำนวณคะแนนเฉลี่ย
                const total = ratings.reduce((sum, item) => sum + item.rating, 0);
                const average = ratings.length > 0 ? total / ratings.length : 0;
                
                // อัปเดตในตาราง submissions
                const { error: updateError } = await supabase
                    .from('submissions')
                    .update({ average_rating: average })
                    .eq('id', submissionId);
                
                if (updateError) throw updateError;
                
            } catch (error) {
                console.error('Error updating average rating:', error);
                throw error;
            }
        }

        // ฟังก์ชันตั้งค่า event listeners
        function setupEventListeners() {
            // Filter button
            const applyFiltersBtn = document.getElementById('applyFilters');
            if (applyFiltersBtn) {
                applyFiltersBtn.addEventListener('click', loadSubmissions);
            }
            
            // Rating modal
            const cancelRatingBtn = document.getElementById('cancelRating');
            if (cancelRatingBtn) {
                cancelRatingBtn.addEventListener('click', closeRatingModal);
            }
            
            const submitRatingBtn = document.getElementById('submitRating');
            if (submitRatingBtn) {
                submitRatingBtn.addEventListener('click', submitRating);
            }
            
            // Report modal
            const cancelReportBtn = document.getElementById('cancelReport');
            if (cancelReportBtn) {
                cancelReportBtn.addEventListener('click', closeReportModal);
            }
            
            const submitReportBtn = document.getElementById('submitReport');
            if (submitReportBtn) {
                submitReportBtn.addEventListener('click', submitReport);
            }
            
            // Star rating interaction
            document.querySelectorAll('.star').forEach(star => {
                star.addEventListener('click', function() {
                    const rating = parseInt(this.dataset.rating);
                    
                    // Update all stars
                    document.querySelectorAll('.star').forEach((s, index) => {
                        if (index < rating) {
                            s.classList.remove('far');
                            s.classList.add('fas', 'active');
                        } else {
                            s.classList.remove('fas', 'active');
                            s.classList.add('far');
                        }
                    });
                    
                    const ratingTexts = ['เลือกจำนวนดาว', 'แย่มาก', 'ไม่ดี', 'พอใช้', 'ดี', 'ดีมาก'];
                    const ratingText = document.getElementById('ratingText');
                    if (ratingText) {
                        ratingText.textContent = ratingTexts[rating];
                    }
                });
            });
            
            // Modal overlays
            const ratingModal = document.getElementById('ratingModal');
            if (ratingModal) {
                ratingModal.addEventListener('click', (e) => {
                    if (e.target === ratingModal) {
                        closeRatingModal();
                    }
                });
            }
            
            const reportModal = document.getElementById('reportModal');
            if (reportModal) {
                reportModal.addEventListener('click', (e) => {
                    if (e.target === reportModal) {
                        closeReportModal();
                    }
                });
            }
        }

        // ฟังก์ชันแสดง toast

            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg z-50 transition-all duration-300 ${
                type === 'success' ? 'bg-green-100 text-green-800 border border-green-200' :

                'bg-blue-100 text-blue-800 border border-blue-200'
            }`;
            toast.innerHTML = `

                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'} mr-2"></i>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }
